name: Build & Release Android and Web

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android Binaries & Web PWA
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter Environment
        run: flutter doctor -v

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Code Analysis
        run: flutter analyze

      - name: Run Automated Test Suite
        run: flutter test

      # --- BUILD ANDROID ---
      - name: Build Android APK (Direct install)
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Build Android App Bundle (Google Play Store)
        run: flutter build appbundle --release --android-skip-build-dependency-validation

      # --- BUILD WEB PWA ---
      - name: Build Web Release (PWA GitHub Pages)
        run: flutter build web --release --base-href "/dynamic-plates-edu/"

      - name: Bundle Privacy Policy and .nojekyll into Web Distribution
        run: |
          cp docs/privacy-policy.html build/web/privacy-policy.html
          touch build/web/.nojekyll

      # --- ARTIFACTS UPLOAD ---
      - name: Upload Android Binaries (APK & AAB)
        uses: actions/upload-artifact@v4
        with:
          name: dynamic-plates-edu-android-release
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Upload Web PWA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dynamic-plates-edu-web-pwa
          path: build/web/
          if-no-files-found: error

      # --- DEPLOY TO GITHUB PAGES ---
      - name: Deploy Web to GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
          keep_files: false

      # --- RELEASE DEPLOYMENT (ON TAGS) ---
      - name: Create GitHub Release on Version Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          draft: false
          prerelease: false
          generate_release_notes: true
